<!Doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories</title>
    <link rel="stylesheet" href="../styles/category-style.css" />
    <link rel="icon" href="../assets/icons8-a-64.png" />
 <!-- Toastify CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />

    <!-- Toastify JS -->
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

     <link rel="stylesheet" href="/frontend/styles/Nav.css">

  <body>
    <header>
    <div id="Nav">

    </div>
    </header>
    <!-- ... header ... -->
    <main>
      <div class="section-title top">
        TOP CATEGORIES

        <div class="category-grid vertical">
          <div
            onclick="
              window.location.href = './category.html?category=breakfast'
            "
            class="category-card"
          >
            <img
              src="../assets/food_image/Categories/break_fast.jpg"
              alt="Breakfast"
            />
            <span>Breakfast</span>
          </div>

          <div
            onclick="window.location.href = './category.html?category=lunch'"
            class="category-card"
          >
            <img src="../assets/food_image/Categories/lunch.avif" alt="Lunch" />
            <span>Lunch</span>
          </div>

          <div
            onclick="window.location.href = './category.html?category=dinner'"
            class="category-card"
          >
            <img
              src="../assets/food_image/Categories/dinner.webp"
              alt="Dinner"
            />
            <span>Dinner</span>
          </div>

          <div
         
            onclick="window.location.href = './category.html?category=snacks'"
            class="category-card"
          >
            <img
              src="../assets/food_image/Categories/snacks.jpg"
              alt="Snacks"
            />
            <span>Snacks</span>
          </div>

          <div
           
            onclick="window.location.href = './category.html?category=drinking'"
            class="category-card"
          >
            <img
              src="../assets/food_image/Categories/drinking.JPG"
              alt="Drinks"
            />
            <span>Juice</span>
          </div>
        </div>
      </div>

      <div id="Cate"></div>
      <div id="review">
        <!-- comment -->
      </div>
      <div class="section-title">RECOMMENDED</div>
      <div class="for-you">
        <div id="cardContainer" class="card-grid"></div>
      </div>
    </main>
    <footer >
      <div class="footer">

        <small>© 2025 Annesana. All Rights Reserved.</small>
      </div>
    </footer>
    <script src="../scripts/common.js"></script>
    <script src="../scripts/category.js"></script>
    <script src="../scripts/reviewLike.js"></script>
  </body>
</html>
